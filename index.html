<script>
(function () {
  "use strict";

  /* ---------------- 常量配置 ---------------- */
  var TRACKS = ["半导体设备", "CPO", "国产算力", "存储芯片", "恒生科技", "美股市场"];
  var EVENT_TYPES = ["政策监管", "公司公告", "行业数据", "供应链变动", "技术进展", "机构观点"];
  var DIRECTIONS = ["正面", "负面", "中性", "待观察"];
  var STRENGTHS = ["强", "中", "弱", "待验证"];

  var DIRECTION_COLOR = {
    "正面": "#00B42A",
    "负面": "#F53F3F",
    "中性": "#86909C",
    "待观察": "#86909C"
  };
  var STRENGTH_RANK = { "强": 0, "中": 1, "弱": 2, "待验证": 3 };
  var STRENGTH_STYLE = {
    "强":   "background:rgba(22,93,255,0.10);color:#165DFF;",
    "中":   "background:#F2F3F5;color:#4E5969;",
    "弱":   "background:#F7F8FA;color:#86909C;",
    "待验证": "background:rgba(255,125,0,0.10);color:#FF7D00;"
  };

  /* 筛选状态：每个维度单选，跨维度组合过滤 */
  var state = { track: "全部", type: "全部", direction: "全部", strength: "全部" };
  var DATA = null;

  /* ---------------- 工具函数 ---------------- */
  function esc(s) {
    if (s === null || s === undefined) return "";
    return String(s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function el(id) { return document.getElementById(id); }
  function validUrl(u) { return typeof u === "string" && /^https?:\/\//i.test(u); }

  /* ---------------- 筛选器渲染 ---------------- */
  function renderFilters() {
    var groups = [
      { key: "track",     label: "关联赛道", options: ["全部"].concat(TRACKS) },
      { key: "type",      label: "事件类型", options: ["全部"].concat(EVENT_TYPES) },
      { key: "direction", label: "影响方向", options: ["全部"].concat(DIRECTIONS) },
      { key: "strength",  label: "证据强度", options: ["全部"].concat(STRENGTHS) }
    ];
    var html = groups.map(function (g) {
      var pills = g.options.map(function (opt) {
        var active = state[g.key] === opt ? " active" : "";
        return '<button type="button" class="pill' + active + '" data-group="' + g.key +
               '" data-value="' + esc(opt) + '">' + esc(opt) + "</button>";
      }).join("");
      return '<div class="flex items-start gap-2 flex-wrap">' +
             '<span class="text-[12px] text-[#86909C] leading-[28px] shrink-0">' + g.label + "</span>" +
             '<div class="flex flex-wrap gap-2">' + pills + "</div></div>";
    }).join("");
    el("filterGroups").innerHTML = html;
  }

  /* 筛选点击（仅绑定一次，事件委托到持久存在的父容器） */
  el("filterGroups").addEventListener("click", function (e) {
    var btn = e.target.closest(".pill");
    if (!btn) return;
    state[btn.getAttribute("data-group")] = btn.getAttribute("data-value");
    renderFilters();
    renderEvents();
  });

  /* ---------------- 数据过滤与排序 ---------------- */
  function filteredEvents() {
    var list = (DATA && Array.isArray(DATA.events)) ? DATA.events : [];
    return list.filter(function (ev) {
      if (state.track !== "全部" && !(ev.tracks || []).includes(state.track)) return false;
      if (state.type !== "全部" && !(ev.eventTypes || []).includes(state.type)) return false;
      if (state.direction !== "全部" && ev.impactDirection !== state.direction) return false;
      if (state.strength !== "全部" && ev.evidenceStrength !== state.strength) return false;
      return true;
    });
  }

  function sortByStrength(arr) {
    return arr.slice().sort(function (a, b) {
      var ra = STRENGTH_RANK.hasOwnProperty(a.evidenceStrength) ? STRENGTH_RANK[a.evidenceStrength] : 4;
      var rb = STRENGTH_RANK.hasOwnProperty(b.evidenceStrength) ? STRENGTH_RANK[b.evidenceStrength] : 4;
      if (ra !== rb) return ra - rb;
      return String(b.publishTime || "").localeCompare(String(a.publishTime || ""));
    });
  }

  /* ---------------- 事件卡片 ---------------- */
  function tagHtml(text, style) {
    return '<span class="tag" style="' + style + '">' + esc(text) + "</span>";
  }

  function sourceText(ev) {
    var names = (ev.sources || []).map(function (s) { return s.name; }).filter(Boolean);
    return names.join(" / ") || "待验证";
  }

  function primaryUrl(ev) {
    var src = (ev.sources || []).find(function (s) { return validUrl(s.url); });
    return src ? src.url : "";
  }

  function eventCard(ev) {
    var dirColor = DIRECTION_COLOR[ev.impactDirection] || "#86909C";
    var strengthStyle = STRENGTH_STYLE[ev.evidenceStrength] || STRENGTH_STYLE["待验证"];

    var trackTags = (ev.tracks || []).map(function (t) {
      return tagHtml(t, "background:rgba(22,93,255,0.08);color:#165DFF;");
    }).join("");
    var typeTags = (ev.eventTypes || []).map(function (t) {
      return tagHtml(t, "background:#F2F3F5;color:#4E5969;");
    }).join("");
    var strengthTag = tagHtml("证据强度：" + (ev.evidenceStrength || "待验证"), strengthStyle);

    var dirTag = tagHtml("影响方向：" + (ev.impactDirection || "待观察"),
      "background:" + dirColor + "1A;color:" + dirColor + ";");

    var hasMore = (ev.marketInterpretation && ev.marketInterpretation.trim()) ||
                  (ev.rumorNote && ev.rumorNote.trim());

    var moreBody = "";
    if (hasMore) {
      var parts = [];
      if (ev.marketInterpretation && ev.marketInterpretation.trim()) {
        parts.push('<div><span class="text-[12px] font-semibold text-[#4E5969]">市场解读：</span>' +
                   '<span class="text-[12px] text-[#4E5969]">' + esc(ev.marketInterpretation) + "</span></div>");
      }
      if (ev.rumorNote && ev.rumorNote.trim()) {
        parts.push('<div class="mt-2"><span class="text-[12px] font-semibold text-[#FF7D00]">传闻说明：</span>' +
                   '<span class="text-[12px] text-[#4E5969]">' + esc(ev.rumorNote) + "</span></div>");
      }
      moreBody =
        '<div class="mt-3">' +
          '<button type="button" class="collapse-toggle text-[12px] link inline-flex items-center gap-1">' +
            '<span class="collapse-arrow">▶</span><span class="toggle-text">展开市场解读</span>' +
          "</button>" +
          '<div class="collapse-body"><div class="collapse-inner">' +
            '<div class="pt-2 border-t divider mt-2">' + parts.join("") + "</div>" +
          "</div></div>" +
        "</div>";
    }

    var url = primaryUrl(ev);
    var linkHtml = url
      ? '<a class="link text-[12px]" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">查看原文</a>'
      : "";

    return '' +
    '<article class="card relative overflow-hidden">' +
      '<span class="absolute left-0 top-0 bottom-0 w-[3px]" style="background:' + dirColor + ';"></span>' +
      '<div class="p-4 sm:p-5 pl-5 sm:pl-6">' +
        '<div class="flex flex-wrap items-center justify-between gap-2">' +
          '<div class="flex flex-wrap items-center gap-2">' + trackTags + typeTags + strengthTag + dirTag + "</div>" +
          '<span class="text-[12px] text-[#86909C] shrink-0">影响期限：' + esc(ev.impactHorizon || "待验证") + "</span>" +
        "</div>" +
        '<p class="text-[14px] font-semibold text-[#1D2129] leading-6 mt-3 prose-max">' + esc(ev.coreFact || "") + "</p>" +
        '<p class="text-[12px] text-[#86909C] mt-2">关联公司/标的：' + esc(ev.targets || "行业整体") + "</p>" +
        '<p class="text-[12px] text-[#86909C] mt-1">情绪因子类别：' + esc(ev.sentimentFactor || "待验证") + "</p>" +
        moreBody +
        '<div class="flex items-center justify-between gap-3 mt-3 pt-3 border-t divider">' +
          '<span class="text-[12px] text-[#86909C] truncate">来源：' + esc(sourceText(ev)) +
            ' · ' + esc(ev.publishTime || "待验证") + "</span>" +
          linkHtml +
        "</div>" +
      "</div>" +
    "</article>";
  }

  /* ---------------- 渲染：事件分组 ---------------- */
  function renderEvents() {
    var listEl = el("eventList");
    var filtered = filteredEvents();

    el("emptyState").classList.toggle("hidden", filtered.length > 0);

    /* 若筛选维度未限定赛道，按全部赛道分组；限定了赛道则只显示该组 */
    var groups = TRACKS.map(function (track) {
      var evs = sortByStrength(filtered.filter(function (ev) {
        return (ev.tracks || []).includes(track);
      }));
      return { track: track, events: evs };
    }).filter(function (g) { return g.events.length > 0; });

    /* 兜底：筛选后存在事件但不在任何固定赛道组内（数据异常时） */
    var groupedIds = {};
    groups.forEach(function (g) { g.events.forEach(function (ev) { groupedIds[ev.id] = true; }); });
    var orphans = sortByStrength(filtered.filter(function (ev) { return !groupedIds[ev.id]; }));
    if (orphans.length > 0) groups.push({ track: "其他", events: orphans });

    listEl.innerHTML = groups.map(function (g) {
      return '<section>' +
        '<div class="flex items-baseline gap-2 mb-3">' +
          '<h2 class="text-[16px] font-semibold text-[#1D2129]">' + esc(g.track) + "</h2>" +
          '<span class="text-[12px] text-[#86909C]">' + g.events.length + " 条事件</span>" +
        "</div>" +
        '<div class="space-y-3">' + g.events.map(eventCard).join("") + "</div>" +
      "</section>";
    }).join("");
  }

  /* ---------------- 渲染：待验证热度观察 ---------------- */
  function renderRumors() {
    var rumors = (DATA && Array.isArray(DATA.rumors)) ? DATA.rumors : [];
    el("rumorEmpty").classList.toggle("hidden", rumors.length > 0);
    el("rumorList").innerHTML = rumors.map(function (r) {
      return '' +
      '<div class="rounded-[8px] p-3" style="background:#F2F3F5;">' +
        '<div class="flex items-center justify-between gap-2">' +
          '<span class="text-[12px] text-[#86909C]">' + esc(r.track || "行业整体") + "</span>" +
          '<span class="tag" style="background:rgba(255,125,0,0.10);color:#FF7D00;">待验证</span>' +
        "</div>" +
        '<p class="text-[12px] text-[#4E5969] leading-5 mt-2">' + esc(r.content || "") + "</p>" +
        '<div class="flex items-center justify-between gap-2 mt-2">' +
          '<span class="text-[12px] text-[#86909C]">热度：' + esc(r.heat || "待验证") + "</span>" +
          '<span class="text-[12px] text-[#86909C]">' + esc(r.platform || "社媒") +
            (r.time ? " · " + esc(r.time) : "") + "</span>" +
        "</div>" +
      "</div>";
    }).join("");
  }

  /* ---------------- 渲染：顶部统计 ---------------- */
  function renderMeta() {
    var meta = (DATA && DATA.meta) || {};
    var events = (DATA && Array.isArray(DATA.events)) ? DATA.events : [];
    var rumors = (DATA && Array.isArray(DATA.rumors)) ? DATA.rumors : [];
    el("statCutoff").textContent = meta.dataCutoff || "待验证";
    el("statWindow").textContent = meta.timeWindow || "过去24小时";
    el("statEvents").textContent = String(events.length) + " 条";
    el("statRumors").textContent = String(rumors.length) + " 条";
  }

  /* ---------------- 折叠交互（事件委托） ---------------- */
  document.addEventListener("click", function (e) {
    var btn = e.target.closest(".collapse-toggle");
    if (!btn) return;
    var body = btn.parentElement.querySelector(".collapse-body");
    var arrow = btn.querySelector(".collapse-arrow");
    var text = btn.querySelector(".toggle-text");
    var open = body.classList.toggle("open");
    arrow.classList.toggle("open", open);
    text.textContent = open ? "收起" : "展开市场解读";
  });

  /* ---------------- 数据加载 ---------------- */
  function useEmbedded() {
    var node = el("embeddedData");
    if (!node) return false;
    try {
      var json = JSON.parse(node.textContent);
      if (!json || !Array.isArray(json.events)) return false;
      DATA = json;
      el("loadingState").classList.add("hidden");
      renderMeta();
      renderFilters();
      renderEvents();
      renderRumors();
      el("statWindow").textContent = (json.meta && json.meta.timeWindow || "过去24小时") + "（本地预览数据）";
      return true;
    } catch (e) { return false; }
  }

  function init() {
    /* 直接双击打开（file:// 协议）时浏览器会拦截 fetch 本地文件，
       自动切换为内置示例数据渲染；部署到 HTTP 服务后仍读取 data/events.json */
    if (location.protocol === "file:") {
      if (useEmbedded()) return;
    }
    fetch("./data/events.json?_=" + Date.now(), { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (json) {
        if (!json || !Array.isArray(json.events)) throw new Error("invalid schema");
        DATA = json;
        el("loadingState").classList.add("hidden");
        renderMeta();
        renderFilters();
        renderEvents();
        renderRumors();
      })
      .catch(function () {
        el("loadingState").classList.add("hidden");
        el("errorState").classList.remove("hidden");
      });
  }

  init();
})();
</script>
</body>
</html>
